# 警鐘地名の「要素（形態素）」辞書。
# specificity は「その表記だけで災害履歴を示唆する強さ」。久保・沢のように
# 全国に無数にある要素は低く、蛇抜・押出のようにほぼ災害由来のものは高くする。
# substitution_of は替字（換字）の元の字。字面では分からない地名を拾うための鍵。
elements:
  # ------------------------------------------------------------------
  # 土石流・崩壊（明示的な災害地名）
  # ------------------------------------------------------------------
  - id: januke
    label: ジャヌケ（蛇抜・蛇退）
    surfaces: [蛇抜, 蛇退, 蛇拔, 蛇脱]
    readings: [ジャヌケ]
    meaning: 大蛇が抜け出たように山腹を土石流が流下した跡。長野県内では野沢温泉村から旧清内路村までに26箇所が確認されている。
    hazard_types: [debris_flow, slope_failure]
    specificity: 0.95
    source_ids: [nagano_sabo_chimei_general]

  - id: jaraku
    label: ジャラク・ジャクズレ（蛇落・蛇崩）
    surfaces: [蛇落, 蛇崩, 蛇喰, 蛇窪]
    readings: [ジャラク, ジャクズレ]
    meaning: 大蛇が山腹から出るときに大崩壊を起こすという伝承に結びつけて、崩壊そのものを蛇の字で表した地名。広島市安佐南区八木の旧地名「蛇落地悪谷」が代表例。
    hazard_types: [debris_flow, slope_failure]
    specificity: 0.9
    source_ids: [wikipedia_saigai_chimei, kiryu_timeikou_2000, hiroshima_2014_yagi]

  - id: ja
    label: ジャ（蛇）
    surfaces: [蛇]
    readings: [ジャ, ヘビ, クチナワ]
    meaning: 蛇の字は崩壊・土石流を表す。桐生市の蛇崩・蛇穴、豊川市の蛇塚（くちなわづか）など。
    hazard_types: [slope_failure, debris_flow]
    specificity: 0.6
    substitution_of: 崩
    source_ids: [kiryu_timeikou_2000, toyokawa_koaza_bousai, nagano_sabo_chimei_general]

  - id: oshidashi
    label: オシダシ（押出・牛出）
    surfaces: [押出, 押し出, 牛出, 押田]
    readings: [オシダシ, オッタシ]
    meaning: 土石流が谷口から押し出した堆積地。
    hazard_types: [debris_flow]
    specificity: 0.9
    source_ids: [nagano_sabo_chimei_general]

  - id: zoure
    label: ゾウレ（草連）
    surfaces: [草連, 崩連]
    readings: [ゾウレ]
    meaning: 崩壊地。
    hazard_types: [slope_failure]
    specificity: 0.8
    source_ids: [nagano_sabo_chimei_general]

  - id: sori
    label: ソリ（反・剃・橇・曽利）
    surfaces: [剃, 橇, 曽利, 曾利]
    readings: [ソリ]
    meaning: 崩壊地・土砂流出地。
    hazard_types: [slope_failure]
    specificity: 0.55
    source_ids: [nagano_sabo_chimei_general]

  - id: gouro
    label: ゴウロ（郷露・高呂・香炉）
    surfaces: [郷露, 高呂, 香炉, 鴻臚, 五郎露]
    readings: [ゴウロ]
    meaning: 石がごろごろしている所。落石・崩壊の常襲地。
    hazard_types: [rockfall]
    specificity: 0.75
    source_ids: [nagano_sabo_chimei_general]

  - id: kuzure
    label: クズレ・クエ（崩・崩田・大崩・白崩）
    surfaces: [崩, 大崩, 白崩, 崩田, 久江, 久栄, 木崩]
    readings: [クズレ, クエ]
    meaning: 崩壊・地すべりの発生地をそのまま示す地名。
    hazard_types: [slope_failure, landslide]
    specificity: 0.85
    source_ids: [nagano_sabo_chimei_landslide, nogyodoboku_2004, toyokawa_koaza_bousai]

  - id: nuke
    label: ヌケ（抜・野毛）
    surfaces: [抜, 野毛, 野家, 拔]
    readings: [ヌケ, ノケ]
    meaning: 山腹が抜け落ちた崩壊地。桐生市の野毛山は「ノケはヌケ（抜）の転で崩壊地名」と説明される。
    hazard_types: [slope_failure]
    specificity: 0.75
    substitution_of: 抜
    source_ids: [nagano_sabo_chimei_landslide, kiryu_timeikou_2000]

  - id: nagi
    label: ナギ・ナグ（薙・奈木・名久）
    surfaces: [薙, 奈木, 名久, 那木]
    readings: [ナグ]
    meaning: 草木を薙ぎ倒すように崩れた斜面。桐生市地名考は「奈木は薙の替字で崩壊地名」とする。
    hazard_types: [slope_failure]
    specificity: 0.7
    substitution_of: 薙
    source_ids: [kiryu_timeikou_2000]

  - id: tsuetate
    label: ツエタテ（杖立）
    surfaces: [杖立, 杖突]
    readings: [ツエタテ]
    meaning: 地すべり地形を示す地名。
    hazard_types: [landslide]
    specificity: 0.6
    source_ids: [nagano_sabo_chimei_landslide, nogyodoboku_2004]

  - id: nadare
    label: ナダレ（雪崩・傾）
    surfaces: [雪崩, 頽, 傾斜崩]
    readings: [ナダレ]
    meaning: 雪崩の常襲地。
    hazard_types: [avalanche]
    specificity: 0.8
    source_ids: [nagano_sabo_chimei_general]

  - id: jigokudani
    label: ジゴク（地獄谷・地獄）
    surfaces: [地獄谷, 地獄]
    readings: [ジゴクダニ, ジゴク]
    meaning: 荒廃した谷・地すべり地形。
    hazard_types: [landslide]
    specificity: 0.6
    source_ids: [nagano_sabo_chimei_landslide, nogyodoboku_2004]

  # ------------------------------------------------------------------
  # 崖・段丘（斜面災害）
  # ------------------------------------------------------------------
  - id: mama
    label: ママ（間々・儘・坿・堹）
    surfaces: [間々, 間間, 儘, 坿, 堹, 真々, 麻々]
    readings: [ママ]
    meaning: 崖地・段丘の崩れ際。桐生市の間々久保は「山腹の崩壊で埋まって出来た久保。間々は崩壊地名」と説明される。豊川市では堹上・堹下として傾斜地・崩れ岸を表す。
    hazard_types: [slope_failure, erosion]
    specificity: 0.7
    source_ids: [nagano_sabo_chimei_general, kiryu_timeikou_2000, toyokawa_koaza_bousai]

  - id: haba
    label: ハバ（幅・羽場・破々）
    surfaces: [幅, 羽場, 破々, 半場]
    readings: [ハバ]
    meaning: 河岸段丘の崖。河岸浸食を受けやすい。
    hazard_types: [erosion, slope_failure]
    specificity: 0.55
    source_ids: [nagano_sabo_chimei_general]

  - id: kura
    label: クラ（倉・蔵・鞍・闇）
    surfaces: [倉, 蔵, 鞍, 闇, 暗]
    readings: [クラ]
    meaning: がけ・絶壁。桐生市地名考は「闇は倉の換字で崩壊地名」とする。
    hazard_types: [slope_failure, rockfall]
    specificity: 0.45
    substitution_of: 倉
    source_ids: [nagano_sabo_chimei_general, kiryu_timeikou_2000]

  - id: kake
    label: カケ・ガケ（欠・崖・垳・柿・岸）
    surfaces: [欠, 崖, 垳, 柿, 岸, 垂, 刈]
    readings: [カケ, ガケ, キシ]
    meaning: 斜面・崖。豊川市では欠下、岸下などの小字名が土砂災害危険箇所と重なる。
    hazard_types: [slope_failure]
    specificity: 0.45
    source_ids: [nagano_sabo_chimei_general, toyokawa_koaza_bousai]

  - id: baba
    label: ババ（馬場）
    surfaces: [馬場]
    readings: [ババ, マバ]
    meaning: 桐生市地名考は「馬場は崩壊地名で崖をいう」とする。馬の飼育地とは限らない。
    hazard_types: [slope_failure]
    specificity: 0.4
    substitution_of: 崩
    source_ids: [kiryu_timeikou_2000]

  - id: ochi
    label: オチ（落々・落内・落打）
    surfaces: [落々, 落内, 落打]
    readings: [オチ, オチオチ]
    meaning: 山麓が崩壊している区域を示す崩壊地名。
    hazard_types: [slope_failure]
    specificity: 0.5
    source_ids: [kiryu_timeikou_2000]

  - id: zaku
    label: ザク・ザレ（座供・砂礫）
    surfaces: [座供, 砂礫, 沙礫, 雑句]
    readings: [ザク, ザレ]
    meaning: 崩れて礫が堆積した斜面。
    hazard_types: [slope_failure, rockfall]
    specificity: 0.6
    source_ids: [kiryu_timeikou_2000, nagano_sabo_chimei_general]

  - id: kuwa
    label: クワ（桑・鍬）
    surfaces: [桑, 鍬]
    readings: [クワ]
    meaning: 崖地。桑畑の意とは限らない。
    hazard_types: [slope_failure]
    specificity: 0.3
    source_ids: [nagano_sabo_chimei_general]

  # ------------------------------------------------------------------
  # 替字（字面では分からない崩壊地名）— 桐生市地名考
  # ------------------------------------------------------------------
  - id: afu_oo
    label: アフ（大・青木＝仰ぐ）
    surfaces: [大谷戸, 青木, 大久保]
    readings: [オオガイト, アオキ]
    meaning: 「大」「青木」はアフ（仰）ぐの語幹の替字で崩壊地名。山腹の崩壊で埋まって出来た傾斜地を指す。
    hazard_types: [slope_failure]
    specificity: 0.35
    substitution_of: 仰
    source_ids: [kiryu_timeikou_2000]

  - id: suki_hagu
    label: スキ・ムキ・ウギ（杉・麦・荻＝剥）
    surfaces: [杉ノ入, 麦生, 荻ノ久保, 荻]
    readings: [スギノイリ, ムギ, オギ]
    meaning: 「杉」「麦」「荻」はスキ・ムキ・ウギ（剥）の替字で崩壊地名。山肌が剥がれた斜面を指す。
    hazard_types: [slope_failure]
    specificity: 0.4
    substitution_of: 剥
    source_ids: [kiryu_timeikou_2000]

  - id: nazu_natsu
    label: ナズ（夏＝撫）
    surfaces: [夏保, 夏]
    readings: [ナツボ, ナツ]
    meaning: 「夏」はナズ（撫）の転で崩壊地名。桐生市の夏保は「夏保ノ入の山腹の土石流で埋まって出来た傾斜地」と説明される。
    hazard_types: [debris_flow, slope_failure]
    specificity: 0.5
    substitution_of: 撫
    source_ids: [kiryu_timeikou_2000]

  - id: tobi
    label: トビ（飛・鳶・頓・居鳥）
    surfaces: [鳶, 飛, 頓, 居鳥, とびのす, 鳶ノ巣]
    readings: [トビ, トビノス]
    meaning: 「鳶」「飛」「頓」はトビ（飛）の替字で崩壊地名。山崩れで押し流された土砂の堆積地を指す。
    hazard_types: [slope_failure, debris_flow]
    specificity: 0.5
    substitution_of: 飛
    source_ids: [kiryu_timeikou_2000]

  - id: niji_nishi
    label: ニジ（西＝滲・躙）
    surfaces: [西久保, 西山, 西ノ入]
    readings: [ニシクボ, ニシヤマ]
    meaning: 「西」はニジ（滲）むの換字で湿地、またはニジ（躙）るの換字で度々山崩れを起こす山を指す場合がある。方角の西とは限らない。
    hazard_types: [soft_ground, slope_failure]
    specificity: 0.3
    substitution_of: 滲
    source_ids: [kiryu_timeikou_2000]

  - id: kaji_kamu
    label: カジ・カチ（鍛冶・かちの＝噛る）
    surfaces: [鍛冶, かちの入, 加治]
    readings: [カジ, カチノイリ]
    meaning: 「鍛冶」「かち」はカジ（噛）るの語幹で崩壊地名。斜面が噛み取られたように崩れた地形。
    hazard_types: [slope_failure]
    specificity: 0.45
    substitution_of: 噛
    source_ids: [kiryu_timeikou_2000]

  - id: tsubu_chou
    label: ツブ（長者＝潰す）
    surfaces: [長者, 長者かいと]
    readings: [チョウジャ]
    meaning: 「長者」のチョウはチャブス→ツブ（潰）すの意で崩壊地名。ジャ（者）は蛇で崩壊を表す。富豪伝説とは限らない。
    hazard_types: [slope_failure]
    specificity: 0.4
    substitution_of: 潰
    source_ids: [kiryu_timeikou_2000]

  - id: iso_ishi
    label: イソ（磯・伊勢＝石）
    surfaces: [磯ノ入, 伊勢沢, 磯]
    readings: [イソノイリ, イセザワ]
    meaning: 「磯」「伊勢」はイソ（石）の転で崩壊地名。崩れた山腹の岩石で埋まった沢を指す。
    hazard_types: [rockfall, debris_flow]
    specificity: 0.4
    substitution_of: 石
    source_ids: [kiryu_timeikou_2000]

  - id: yusu
    label: ユス（揺る）
    surfaces: [柚須, 湯種, 遊子]
    readings: [ユス]
    meaning: ユス（揺）るは崩壊地名。
    hazard_types: [slope_failure]
    specificity: 0.55
    substitution_of: 揺
    source_ids: [kiryu_timeikou_2000]

  - id: tae_te
    label: タエ（手＝絶）
    surfaces: [室ンデ]
    readings: [タエ, デ]
    meaning: 「手」は絶（タエ）の転で崩壊地名。
    hazard_types: [slope_failure]
    specificity: 0.25
    substitution_of: 絶
    source_ids: [kiryu_timeikou_2000]

  - id: uchide
    label: ウチデ（内田＝打出）
    surfaces: [内田]
    readings: [ウチダ]
    meaning: 「内田」はウチデ（打出）の転。沢の出口付近で、洪水の時に土石流が押し出て埋まる区域を指す。
    hazard_types: [debris_flow, flood]
    specificity: 0.35
    substitution_of: 打出
    source_ids: [kiryu_timeikou_2000]

  # ------------------------------------------------------------------
  # 埋没・窪地
  # ------------------------------------------------------------------
  - id: ume
    label: ウメ（梅・埋・宇目）
    surfaces: [梅, 埋, 宇目]
    readings: [ウメ]
    meaning: 「梅」は埋の替字で、埋立て地・崩壊土砂で埋まった土地を指すことがある。群馬県桐生市の旧小字「梅ヶ久保」のように、梅の木の生えた窪地に見えて実は埋没地というのが典型。
    hazard_types: [landslide, slope_failure]
    specificity: 0.5
    substitution_of: 埋
    source_ids: [nagano_sabo_chimei_general, kiryu_timeikou_2000]

  - id: kubo
    label: クボ（窪・久保）
    surfaces: [窪, 久保]
    readings: [クボ]
    meaning: 窪地・谷。中信・南信に多い。単独では災害履歴を示さないが、崩壊土砂が埋めた窪地であることが多い。
    hazard_types: [inundation, landslide]
    specificity: 0.2
    source_ids: [nagano_sabo_chimei_general]

  - id: yato
    label: ヤト・ガイト（谷戸・谷地・野地）
    surfaces: [谷戸, 谷地, 野地, かいと, 垣内]
    readings: [ヤト, ヤチ, ガイト, カイト]
    meaning: 谷口・低湿地。桐生市域では谷口の地名が集落名に転じた例が多い。豊川市の貝津（カイツ）は垣内由来とされるが小河川沿いに分布する傾向がある。
    hazard_types: [inundation]
    specificity: 0.2
    source_ids: [kiryu_timeikou_2000, toyokawa_koaza_bousai]

  - id: azu
    label: アズ（小豆・厚・熱・安土）
    surfaces: [小豆, 篤, 安土, 阿須, 厚別沢]
    readings: [アズ, アズキ]
    meaning: 土砂流出地。桐生市の小豆田は「アズ（土丹）キの替字で崩壊地名」と説明される。
    hazard_types: [debris_flow, slope_failure]
    specificity: 0.6
    substitution_of: 土丹
    source_ids: [nagano_sabo_chimei_general, kiryu_timeikou_2000]

  - id: shishi
    label: シシ（獅子・宍・鹿・猪）
    surfaces: [獅子, 宍, 鹿, 猪]
    readings: [シシ]
    meaning: 水気の多い所。地崩れを起こしやすい。猪鹿が泥を浴びる湿地の意ともされる。
    hazard_types: [landslide, soft_ground]
    specificity: 0.35
    source_ids: [nagano_sabo_chimei_general, kiryu_timeikou_2000]

  - id: saru
    label: サル（猿・去）
    surfaces: [猿, 去, 申]
    readings: [サル]
    meaning: 崩れて土が去る意。土砂流出地。
    hazard_types: [slope_failure]
    specificity: 0.35
    source_ids: [nagano_sabo_chimei_general, toyokawa_koaza_bousai]

  - id: tai
    label: タイ（田井・台・平・堆）
    surfaces: [田井, 台, 堆]
    readings: [タイ]
    meaning: 河川周辺の段丘上平地。地すべり地形と重なることがある。
    hazard_types: [landslide]
    specificity: 0.15
    source_ids: [nagano_sabo_chimei_general]

  - id: nari
    label: ナリ（成・成田）
    surfaces: [成, 成田]
    readings: [ナリ, ナリタ]
    meaning: 地すべりで斜面が「成った」地形。
    hazard_types: [landslide]
    specificity: 0.3
    source_ids: [nagano_sabo_chimei_landslide, nogyodoboku_2004]

  # ------------------------------------------------------------------
  # 洪水・低湿
  # ------------------------------------------------------------------
  - id: awara
    label: アワラ（阿原・荒原・安原）
    surfaces: [阿原, 荒原, 安原, アワラ, あわら, 阿波羅]
    readings: [アワラ, アバラ]
    meaning: 低湿地。平成12年の東海豪雨で新川堤防が決壊した名古屋市西区「あし原町」の対岸は清須市「阿原」であった。
    hazard_types: [inundation, flood]
    specificity: 0.65
    source_ids: [toyokawa_koaza_bousai]

  - id: ashi
    label: アシ（足・悪・芦・蘆）
    surfaces: [足, 悪, 芦, 蘆, 葦]
    readings: [アシ]
    meaning: 「足」は「悪し」に通じるとされる災害地名。葦の生える低湿地の意にもなる。豊川市の足田・足洗など。
    hazard_types: [flood, inundation]
    specificity: 0.4
    source_ids: [toyokawa_koaza_bousai]

  - id: kawara
    label: カワラ（川原・河原・磧）
    surfaces: [川原, 河原, 磧]
    readings: [カワラ]
    meaning: 旧河道・氾濫原。洪水時に早く冠水する。
    hazard_types: [flood]
    specificity: 0.5
    source_ids: [toyokawa_koaza_bousai, kiryu_timeikou_2000]

  - id: furukawa
    label: フルカワ（古川）
    surfaces: [古川, 古河]
    readings: [フルカワ]
    meaning: 旧河道。洪水時に流路が復活しやすい。
    hazard_types: [flood, inundation]
    specificity: 0.7
    source_ids: [toyokawa_koaza_bousai]

  - id: nagare
    label: ナガレ（流レ・流）
    surfaces: [流レ, 流田, 流地]
    readings: [ナガレ]
    meaning: 洪水で流された、あるいは水が流れ込む低地。
    hazard_types: [flood]
    specificity: 0.5
    source_ids: [toyokawa_koaza_bousai]

  - id: mizuiri
