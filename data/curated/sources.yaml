  - id: iwamatsu_saigai_chimei
    type: web
    title: 災害地名
    author: 岩松暉
    publisher: 鹿児島大学理学部地球環境科学科
    url: https://www.sci.kagoshima-u.ac.jp/oyo/name_r.html
    license: 引用のうえ出典明示
    accessed: "2026-09-11"
