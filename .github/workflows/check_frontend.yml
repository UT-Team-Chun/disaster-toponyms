name: Check Frontend

on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/check_frontend.yml"
  workflow_dispatch:

jobs:
  check_frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Install dependencies
        run: yarn install --frozen-lockfile

      - name: Check formatting
        run: yarn prettier --check .

      - name: Lint and typecheck
        run: yarn lint

      - name: Test
        run: yarn ci:test

      - name: Build for GitHub Pages
        run: yarn build:pages

      - name: Check the dataset is present in the build
        run: |
          test -f build/client/data/toponyms.geojson
          test -f build/client/data/stats.json
          test -f build/client/404.html
