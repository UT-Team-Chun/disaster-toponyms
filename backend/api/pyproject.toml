[project]
name = "api"
version = "0.1.0"
description = "API application for FastAPI"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alg",
    "gateways[all]",
    "fastapi>=0.105.0",
    "httpx>=0.26.0",
    "loguru>=0.7.3",
    "openai>=2.8.1",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.12.0",
    "pyyaml>=6.0.3",
    "uvicorn>=0.30.0",
]

[dependency-groups]
dev = [
    "boto3-stubs[s3]>=1.40.74",
    "coverage>=7.10.3",
    "ipykernel>=7.1.0",
    "mypy>=1.17.1",
    "pytest>=8.4.1",
    "ruff>=0.12.8",
    "tach>=0.32.0",
    "types-pyyaml>=6.0.12.20250915",
]

[project.optional-dependencies]
additional = []

[tool.uv.sources]
alg = { workspace = true }
gateways = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.mypy]
plugins = "pydantic.mypy"
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Missing trailing comma (conflicts with formatter)
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D400",   # First line should end with a period
    "D403",   # First word of the docstring should be properly capitalized
    "D415",   # First line should end with a period, question mark, or exclamation point
    "TC001",  # Move first-party import into a type-checking block
    "TC002",  # Move third-party import into a type-checking block
    "TC003",  # Move standard-library import into a type-checking block
    "RUF003", # Checks for ambiguous Unicode characters in comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**/*.py" = ["S101", "ANN201", "PLR2004", "PLR0913", "SLF001"]
"dev/**/*.py" = ["T201", "INP001"]

[tool.coverage]
source = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
