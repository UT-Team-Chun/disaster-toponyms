[project]
name = "gateways"
version = "0.1.0"
description = "Shared gateway operations for external systems (DB, AWS, OpenAI, etc.)"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.0.0",
    "pydantic-settings>=2.12.0",
]

[project.optional-dependencies]
rdb = [
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",  # PostgreSQL adapter
    "alembic>=1.17.0",  # Database migration tool
]
llm = [
    "openai>=1.0.0",
]
http = [
    "httpx>=0.26.0",
]
raster = [
    "pillow>=11.0.0",
]
gis = [
    "pyshp>=2.3.1",
]
aws = [
    "boto3>=1.34.0",
]
all = [
    "httpx>=0.26.0",
    "pillow>=11.0.0",
    "pyshp>=2.3.1",
    "sqlmodel>=0.0.22",
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "alembic>=1.14.0",
    "openai>=1.0.0",
    "boto3>=1.34.0",
]

[dependency-groups]
dev = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateways"]

[tool.hatch.build.targets.wheel.force-include]
"gateways/py.typed" = "gateways/py.typed"

[tool.mypy]
plugins = "pydantic.mypy"
follow_imports = "silent"
warn_redundant_casts = true
warn_unused_ignores = true
check_untyped_defs = true

[[tool.mypy.overrides]]
# pyshp は型スタブを同梱していない
module = ["shapefile"]
ignore_missing_imports = true

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[tool.ruff]
line-length = 99

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "COM812", # Missing trailing comma (conflicts with formatter)
    "D100",   # Missing docstring in public module
    "D101",   # Missing docstring in public class
    "D102",   # Missing docstring in public method
    "D103",   # Missing docstring in public function
    "D104",   # Missing docstring in public package
    "D105",   # Missing docstring in magic method
    "D106",   # Missing docstring in public nested class
    "D107",   # Missing docstring in __init__
    "D203",   # 1 blank line required before class docstring (conflicts with D211)
    "D213",   # Multi-line docstring summary should start at the second line (conflicts with D212)
    "D400",   # First line should end with a period
    "D403",   # First word of the docstring should be properly capitalized
    "D415",   # First line should end with a period, question mark, or exclamation point
    "TC001",  # Move first-party import into a type-checking block
    "TC002",  # Move third-party import into a type-checking block
    "TC003",  # Move standard-library import into a type-checking block
    "RUF001", # Ambiguous Unicode characters in strings (Japanese punctuation)
    "RUF002", # Ambiguous Unicode characters in docstrings (Japanese punctuation)
    "RUF003", # Checks for ambiguous Unicode characters in comments
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"**/tests/**/*.py" = ["S101", "ANN201", "PLR2004", "PLR0913", "SLF001"]

[tool.coverage]
source = ["tests"]

[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 100
