interfaces = []
exclude = [
    "**/*__pycache__",
    "**/*egg-info",
    "**/tests",
]
source_roots = [
    ".",
]

# 低レイヤ: 共有HTTPクライアント（キャッシュ・レート制限）
[[modules]]
path = "gateways.http"
depends_on = []

# rdb は backend の features からのみ利用する
[[modules]]
path = "gateways.rdb"
depends_on = []

# llm は alg からアクセス可能
[[modules]]
path = "gateways.llm"
depends_on = []

# aws は alg からアクセス可能
[[modules]]
path = "gateways.aws"
depends_on = []

# gsi/web は公開Web APIへの接続。共有HTTPクライアントのみに依存
[[modules]]
path = "gateways.gsi"
depends_on = [
    {path = "gateways.http"},
]

[[modules]]
path = "gateways.web"
depends_on = [
    {path = "gateways.http"},
]

# estat は国勢調査の小地域境界（町丁・字等ポリゴン）を取得する
[[modules]]
path = "gateways.estat"
depends_on = [
    {path = "gateways.http"},
]

# ndl は国立国会図書館デジタルコレクションの全文APIに接続する
[[modules]]
path = "gateways.ndl"
depends_on = [
    {path = "gateways.http"},
]

# nihu は人間文化研究機構の歴史地名データ（旧地名の座標）を取得する
[[modules]]
path = "gateways.nihu"
depends_on = [
    {path = "gateways.http"},
]

# codh は人文学オープンデータ共同利用センターの歴史地名索引を取得する
[[modules]]
path = "gateways.codh"
depends_on = [
    {path = "gateways.http"},
]
